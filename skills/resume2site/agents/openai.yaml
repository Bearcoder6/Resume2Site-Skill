display_name: Resume2Site
short_description: Turn resumes and projects into polished GitHub Pages personal websites.
default_prompt: Use Resume2Site to convert my resume into a polished GitHub Pages personal website. Create profile.json and site-plan.md before generating the site, choose academic or landing mode, run the lightweight file-based final quality checklist, and give me the output/site/index.html path. Do not require screenshots or browser automation.
